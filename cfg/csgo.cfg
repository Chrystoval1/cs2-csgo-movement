// =====================================================================
//  cs2-csgo-movement — "csgo" preset (server-side)
//  Exec on an INSECURE community dedicated server (no VAC).
//  These cvars are server-side and replicated; the client predicts with
//  them, so the feel changes without touching the client.
//
//  The two subtick lines below are the meaningful levers. The movement
//  numbers are identical to the "vanilla" preset on purpose — CS:GO and
//  CS2 share these defaults, so the felt difference comes from subtick.
//  Treat every value as a tunable starting point, not a constant.
// =====================================================================

// --- Subtick levers (the actual difference vs vanilla) ---
sv_quantize_movement_input      1    // force CS:GO-style digital input (removes fractional analog speeds)
sv_subtick_movement_view_angles 0    // ignore subtick view angles during movement

// --- Ground / air movement model ---
sv_accelerate                   5.5
sv_airaccelerate                12
sv_air_max_wishspeed            30
sv_friction                     5.2
sv_maxspeed                     320
sv_gravity                      800

// --- Jumping ---
sv_enablebunnyhopping           0
sv_autobunnyhopping             0

echo "[cs2-csgo-movement] csgo preset loaded."
