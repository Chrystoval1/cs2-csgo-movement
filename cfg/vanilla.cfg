// =====================================================================
//  cs2-csgo-movement — "vanilla" preset (server-side)
//  Restores stock CS2 subtick behaviour. The movement numbers match the
//  "csgo" preset exactly, so switching between the two isolates the
//  subtick levers for a clean A/B comparison of the feel.
// =====================================================================

// --- Subtick levers (stock CS2) ---
sv_quantize_movement_input      0
sv_subtick_movement_view_angles 1

// --- Ground / air movement model (same as csgo preset) ---
sv_accelerate                   5.5
sv_airaccelerate                12
sv_air_max_wishspeed            30
sv_friction                     5.2
sv_maxspeed                     320
sv_gravity                      800

// --- Jumping ---
sv_enablebunnyhopping           0
sv_autobunnyhopping             0

echo "[cs2-csgo-movement] vanilla preset loaded."
