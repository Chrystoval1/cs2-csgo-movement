// =====================================================================
//  cs2-csgo-movement — "surf" preset (server-side, EXPERIMENTAL)
//  High air acceleration + bunnyhopping for surf maps. Surf maps vary a
//  lot; these values are a starting point, tune them to your rotation.
// =====================================================================

// --- Subtick levers ---
sv_quantize_movement_input      1
sv_subtick_movement_view_angles 0

// --- Surf-tuned movement model ---
sv_accelerate                   10
sv_airaccelerate                150
sv_air_max_wishspeed            30
sv_friction                     4
sv_maxspeed                     320
sv_gravity                      800

// --- Jumping ---
sv_enablebunnyhopping           1
sv_autobunnyhopping             1

echo "[cs2-csgo-movement] surf preset loaded."
